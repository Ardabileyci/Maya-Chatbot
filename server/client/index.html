<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya – Akademisyen | Arı Bilgi</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-content">
                <div class="maya-identity">
                    <div class="avatar-container">
                        <!-- MAYA RESMİNİ BURAYA EKLE: assets/maya-robot.png -->
                        <img src="assets/maya-robot.png" alt="Maya" class="maya-avatar" onerror="this.src='assets/maya.svg';">
                    </div>
                    <div class="maya-info">
                        <h1 class="maya-name">Maya</h1>
                        <span class="maya-title">Akademisyen</span>
                    </div>
                </div>
                <div class="institution-badge">
                    <span>Arı Bilgi</span>
                </div>
            </div>
        </header>

        <!-- Chat Messages Container -->
        <main class="chat-container" id="chatContainer">
            <div class="messages-wrapper" id="messagesWrapper">
                <!-- Welcome Message -->
                <div class="message maya-message">
                    <div class="message-avatar">
                        <img src="assets/maya-robot.png" alt="Maya" onerror="this.src='assets/maya.svg';">
                    </div>
                    <div class="message-content">
                        <div class="message-bubble">
                            <p>Merhaba! Ben Maya, Arı Bilgi'de akademisyenim. 👋</p>
                            <p>Size eğitimleriniz, ödevleriniz ve dersleriniz hakkında yardımcı olabilirim. Ne konuda yardımcı olmamı istersin?</p>
                        </div>
                    </div>
                </div>
                <!-- Typing Indicator -->
                <div class="typing-indicator" id="typingIndicator" style="display: none;">
                    <div class="message maya-message">
                        <div class="message-avatar">
                            <img src="assets/maya-robot.png" alt="Maya" onerror="this.src='assets/maya.svg';">
                        </div>
                        <div class="message-content">
                            <div class="message-bubble typing">
                                <span class="typing-text">Maya yazıyor</span>
                                <span class="typing-dots">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-input-area">
            <!-- Image Preview -->
            <div id="imagePreview" class="image-preview-container" style="display: none;">
                <img id="previewImg" src="" alt="Önizleme">
                <button id="removeImage" class="remove-image-btn" aria-label="Görseli kaldır">×</button>
            </div>
            
            <div class="input-container">
                <!-- Hidden file input -->
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                
                <!-- Image upload button -->
                <button id="imageButton" class="image-button" aria-label="Görsel ekle" title="Görsel ekle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>
                
                <textarea 
                    id="messageInput" 
                    class="message-input" 
                    placeholder="Sorunuzu yazın..."
                    rows="1"
                    maxlength="2000"
                ></textarea>
                <button id="sendButton" class="send-button" aria-label="Gönder">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="input-hint">
                <span>Enter ile gönder • Shift+Enter ile yeni satır • 📷 Görsel ekleyebilirsiniz</span>
            </div>
        </footer>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="image-modal" onclick="closeImageModal()">
        <span class="modal-close">&times;</span>
        <img id="modalImage" class="modal-content" src="" alt="Büyük görsel">
    </div>

    <script src="app.js"></script>
</body>
</html>
